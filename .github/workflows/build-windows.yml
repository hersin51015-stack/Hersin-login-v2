name: Build Android APK & Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Clean Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: login-app-android-apk
          path: app/build/outputs/apk/debug/*.apk

  build-windows-exe:
    name: Build Windows 7 to 11 EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Standalone Windows EXE
        shell: pwsh
        run: |
          dotnet build windows/LoginApp.csproj -c Release
          $exePath = Get-ChildItem -Path "windows/bin/Release" -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($exePath) {
            New-Item -ItemType Directory -Force -Path "release-exe"
            Copy-Item -Path $exePath.FullName -Destination "release-exe/LoginApp-Windows7-11.exe"
          } else {
            dotnet publish windows/LoginApp.csproj -c Release -r win-x64 --self-contained false -o release-exe
          }

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: login-app-windows7-11-exe
          path: release-exe/*.exe

  release:
    name: Create GitHub Release
    needs: [build-apk, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: login-app-android-apk
          path: release-all

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: login-app-windows7-11-exe
          path: release-all

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-all/*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
